[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "samfast"
version = "0.1.0"
description = "GIL-free Suffix Automaton (SAM) implemented in C++ with pybind11, Python API compatible with the original class"
authors = [{name = "huawei"}]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["samfast"]

[tool.setuptools.package-data]
# include nothing extra